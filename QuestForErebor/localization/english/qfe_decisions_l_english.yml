 decision_restore_atyamar: "Restore Atyamar"
 decision_restore_atyamar_desc: "During the [greatjourney|e] many [elves|e], esspecially those of [telerielves|e] origin opted to stay around the Vales of Anduin, these [silvanelves|e] would later form the great realms of [lothlorien|e] and the [greenwood|e]. if these lands and peoples could be brought under one crown, Atyamar, the second home, could be restored and the [silvanelves|e] could be reunited"
