 qfe_misc.08.desc: "[goblin_town_settler.GetFirstName] has arrived in whats left of goblin town and has set up the hold of [GetTitleByKey('d_goblin_town').GetNameNoTier], Pledging to defeat the mountian passes in friendship with the [noldorelves|e] and the Men of the Vale"
