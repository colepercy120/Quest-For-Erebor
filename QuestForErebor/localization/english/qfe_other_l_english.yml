 ### Bookmarks
 
 bm_2941_quest_for_erebor_01: "The Quest for Erebor"
 bm_2941_quest_for_erebor_01_desc: "It's been 170 years since the Sack of Erebor, and things are once again moving in the north. The dragon Smaug has lain dormant for decades, and the Exiles of Erebor are preparing to challenge the dragon once more.\n\nIn Mirkwood, the Necromancer is continuing his search for the One Ring and is slowly growing his influence over the region, attracting the attention of the White Council. \n\nFarther South Gondor sees threats on all sides with very little in the way of friends, the Witch King rules Mordor, preparing to destroy the Faithful once and for all, while the Corsairs of Umbar assemble a grand fleet."
 
 start_year_6974_01_01_desc: "It’s been 170 years since the Sack of Erebor, and things are once again moving in the north. The dragon Smaug has lain dormant for decades, and the Exiles of Erebor are preparing to challenge the dragon once more.\n\nIn Mirkwood, the Necromancer is continuing his search for the One Ring and is slowly growing his influence over the region, attracting the attention of the White Council. \n\nFarther South Gondor sees threats on all sides with very little in the way of friends, the Witch King rules Mordor, preparing to destroy the Faithful once and for all, while the Corsairs of Umbar assemble a grand fleet."
 
 bm_group_2941TA: "The Quest for Erebor"
 
 bookmark_qfe_thranduil:  "King Thranduil"
 bookmark_qfe_thranduil_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_thranduil_desc:  "Thranduil, the Elvenking, Lord of the woodland realm, is a fairly passive player in Middle-earth. From his halls in northwestern [mirkwood|e] he rules justly but rarely involves himself in the greater events of the day. \n\nBut things are changing in the Dalelands, the [dragon|e] [smaug|e] is stirring and the [dwarves|e] are plotting. will he leave his halls or will he at last make his mark on Middle-earth?"
 
 bookmark_qfe_thorin: "Thorin Oakenshield"
 bookmark_qfe_thorin_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_thorin_desc: "Thorin has had a rough life. Raised in [ereborrealm|e] at the height of its power, he watched [smauggolden|E] destroy his home and shatter his people. watched his father and grandfather fall to the challenges that faced them, already has experienced failure in retaking [moria|e] and has spent the last decades biding his time in the [bluemountains|e]. \n\nBut word from [gandalfcharacter|e] has ignited a fire in the dwarf king, [erebor|e] must be reclaimed! [smaug|e] must fall! And Thorin intends to be the one to bring the dragon down."
 
 bookmark_qfe_bilbo: "Bilbo Baggins"
 bookmark_qfe_bilbo_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_bilbo_desc: "Bilbo Baggins is an unremarkable [hobbit|e], around 3 foot 3, he loves nothing more than sitting in his home with a good book and warm meal. But the wizard [gandalfcharacter|e] has spied something more in the young hobbit, Bilbo is about to be offered the chance of a lifetime, and the time may come for hobbits to decide the fate of men."
 
 bookmark_qfe_dain: "Dain Ironfoot"
 bookmark_qfe_dain_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_dain_desc: "Dain Ironfoot, Lord of the Iron Hills, leads the largest [longbeard|e] colony left in Middle-earth. Since the destruction of [ereborrealm|e], they have had the majority of their population. He's built his realm into a true bastion, the only realm of the north truly able to counter the shadow rising in Mordor. But things are about to change in the north, Dain's cousin Thorin prepares to retake [erebor|e] and Dain stands ready to aid him and restore the realm of their ancestors."
 
 bookmark_qfe_master: "Master Stevron"
 bookmark_qfe_master_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_master_desc: "Master Stevron of Laketown is in a delicate position. Laketown is the northernmost settlement that survived [smauggolden|E]'s ire. But that doesn't mean it flourished. Since the [sackoferebor|e] Laketown has stagnated; each year, the Dalelands produce less as the Desolation of Smaug drains the land. even as word comes of the return of the King Under the Mountain, Laketown stands between Thorin and [smaug|e] and that could be disastrous. \n\nTo play as Bard the Bowman, start as Master Stevron and play through the event chain."
 
 bookmark_qfe_bolg: "Overlord Bolg"
 bookmark_qfe_bolg_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_bolg_desc: "The True heir to Azog the Defiler, Bolg rules over Gundabad with an iron fist. biding his time since the orcs' defeat in the [warofdwarvesandorcs|e], he's secretly been in communication with the [necromancer_sauron|e], plotting for a new wave of orcish dominion across the north, starting with [erebor|e]"

 bm_2941_shadow_over_mirkwood: "Shadow Over Mirkwood"
 bm_2941_shadow_over_mirkwood_desc: "For too long has the Necromancer lain in Greenwood, his presence in Dol Guldur has warped the once strong forest into Mirkwood, foul things grow in the Dark, Forces that should have stayed dead have returned, and rumors swirl of the return of the Dark Lord \n\nThe White Council has seen the warning signs and is finally about to act to once and for all drive the Necromancer from the forest"
 

 bookmark_qfe_gandalf: "Gandalf The Grey"
 bookmark_qfe_gandalf_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_gandalf_desc: "Gandalf The Grey has had a busy time in Middle-earth, a [maiagod|e] from [valinor|e], he has been sent by the [valargods|e] to aid the peoples of Middle-earth against the Shadow, since then he has spent his time hunting for [sauroncharacter|e] and the other remnants of [morgothcharacter|e]s works. He has recently grown suspicious of the [necromancer_sauron|e] in [dolguldur|e] and the dragon [smauggolden|E] and is in the early stages of executing his plans to counter them" 

 bookmark_qfe_saruman: "Saruman the White"
 bookmark_qfe_saruman_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_saruman_desc: "Saruman the White is the leader of the [whitecouncil|e] of the wise, a group of [elves|e] and [wizards|e] aiming to counter [sauroncharacter|e] and all his works. Saruman has set himself up in [orthanc|e] to both guards over [rohan|e] and very quietly search the [anduin|e] for the missing [onering|e]. he has been a continuous voice of caution against moving on the [necromancer_sauron|e] and instead prefers to watch his actions from afar"
 
 bookmark_qfe_sauron: "Necromancer Sauron"
 bookmark_qfe_sauron_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_sauron_desc: "The [necromancer_sauron|e] is in truth but another guise for the [darklord|e] [sauroncharacter|e]. Hiding in the ancient [greenwood|e], his presence has slowly warped the forest into [mirkwood|e]. he has had to balance the [suspicion|e] of the [whitecouncil|e] against his own plans for world domination, quietly supporting various dark forces across the world while quietly searching for the lost [onering|e]"
 
 bookmark_qfe_elrond: "Elrond of Rivendell"
 bookmark_qfe_elrond_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_elrond_desc: "Elrond has had a fairly tame millennia, since the fall of the [witchking|e] of [angmar|e] his realm has been safe and secure nestled a valley in the [mistymountians|e], but times are changing, the [whitecouncil|e] is almost ready to move on the [necromancer_sauron|e] and Thorin Oakenshield is preparing his quest to retake [erebor|e]. How Elrond responds could very easily shift the course of history..."
 
 bookmark_qfe_galadriel: "Lady Galadriel"
 bookmark_qfe_galadriel_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_qfe_galadriel_desc: "The Lady of Lorien is arguably the [whitecouncil|e]s most respected member, trained by [meliancharacter|e] in [doriath|e] in the [elderdays|e] her knowledge of lore is unparallelled in Middle-earth and she has been watching the [necromancer_sauron|e] closely, she senses a shadow in [mirkwood|e], and she has to suspect that [sauroncharacter|e] has returned. should her suspicions prove true, the golden wood might once more be roused to war."
 
 
 
