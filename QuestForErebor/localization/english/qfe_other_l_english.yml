 ### Game Concepts
 
 game_concept_smaug: "Smaug"
 game_concept_smauggolden: "Smaug the Golden"
 game_concept_smaugcalamity: "Smaug the Chiefest and Greatest of Calamities"
 game_concept_smaug_desc: "Smaug the Golden, also known as Smaug the Chiefest and Greatest of Calamities, was the strongest [dragon|e] of the [thirdage|e]. He famously destroyed the kingdom of [erebor|e] in the [sackoferebor|e] and ruled under the mountain for 170 years before being slain by Bard the bowman in [ageTA|e] 2941. His body would lie in the Long Lake for centuries, the dragon's memory preventing all but the bravest looters."
 
 game_concept_sackoferebor: "Sack of Erebor"
 game_concept_sackoferebor_desc: "#emphasis The pines were roaring on the height,\nThe winds were moaning in the night.\nThe fire was red, it flaming spread;\nThe trees like torches blazed with light.#! \n\nBy the late [thirdage|e] the Dwarves of [erebor|e] were considered among the greatest artisans and smiths in all Middle-earth, perhaps the single greatest group left. Their gold was plenty, their warriors strong, and they were friends with both the [elves|e] of [mirkwood|e] and the men of Dale. however, that wealth drew the ire of the [dragon|e] [smaug|e] \n\nIn late 2770 [smaug|e] descended on the [lonelymountian|E] and sacked it. killing most of the [longbeards|e] living within the mountain and leveling the city of Dale built at its base. holding the mountain as his own for the next century."
 
 game_concept_quest: "Quest"
 game_concept_quest_points: "Quest Points"
 game_concept_quest_desc: "Quests are a special system introduced by #emphasis Quest for Erebor#!. You will travel to a specific destination and encounter several scripted events depending on your choices. You will earn [quest_points|e] based on your actions during those events. culminating in a final series of [skill|e] challenges with the difficulty based on your number of points."
 
 game_concept_smaughorde: "Hoard"
 game_concept_smaughorde_desc: "The Hoard represents all of the #highlight [gold|e] @gold_icon! #![smaug|e] has stolen over the years. It will be given out to whoever slays the dragon at the end of the [situation|e]."
 
 game_concept_suspicion: "Suspicion"
 game_concept_suspicion_desc: "A measure of how suspicious the [whitecouncil|e] is of the [necromancer_sauron|e], #warning If Suspicion reaches 1000 the Council will attack and try to drive the Necromancer from the forest #!"
 
