 ### Misc
 
 qfe_misc.01.t: "Atyamar Renewed"
 qfe_misc.01.desc: "[silvanelves|e] have dwelt around the Great River for Three Ages of the World, origionally settling during the [greatjourney|e] to [valinor|e] but long ages have passed since Atyamar, the Second Home of the Elves, was whole. But No Longer! \n\nOnce more the [silvanelves|e] are whole! Once more do songs ring out along the banks of the great river, and once more do the [silvanelves|e] have a true united home!"
 qfe_misc.01.a: "To another three ages!"
 
 qfe_misc.10.t: "Return of Angmar"
 qfe_misc.10.desc: "The Dark Lord’s will pressed against my mind, a summon both undeniable and absolute. I knelt before the great lidless eye, shrouded in shadow, awaiting his command. Arnor has risen from its grave, Sauron’s voice seethed within my skull, a whisper of malice and steel. Its kings grow bold. Its people forget their doom. Go, my lieutenant. Go to Angmar, and remind them. A thrill of purpose coursed through me, a rekindling of the dark dominion I had once wielded. The North had slumbered too long in the absence of its true master. The frozen winds of Carn Dûm would howl with my return, and through them, fear would spread like a creeping frost. The realms of men, so foolish in their restoration, would learn that no kingdom born of old ruins could withstand the wrath of the Witch-King. \n\nAs I rose from my obeisance, the forges of Barad-dûr roared, and my steed awaited—its eyes burning with the same cold fire that animated my husk. The banners of Angmar would rise once more, and with them, the night. I would gather the remnants of the old warbands, call forth the spirits that lingered in the barrows, and raise new legions from the frozen wastes. The north had always been mine, and now, by my master’s decree, it would be again. The sons of Arnor would tremble at my coming, and their kings, no matter how noble, would falter as their forebears had before them. Sauron has spoken. I will obey."
 qfe_misc.10.a: "My Lord Commands"
 qfe_misc.10.b: "We wish him luck. (Continue in Mordor)"
 orcsofmordor: "Orcs of Mordor"
 base: "base"
 
 qfe_misc.11.t: "The Return of Angmar"
 qfe_misc.11.desc: "The [witchking|e] has returned to Angmar and his heralds have arrived demanding fealty. we are but pawns in the Great Eye's plans and should submit to the lord of the [nazgul|e] but the final decision for our fate rests with us"
 qfe_misc.11.a: "All Hail the Witch-King!"
 qfe_misc.11.b: "We stay on our own"
 
 qfe_misc.12.t: "Return to Mumakan"
 qfe_misc.12.desc: "My lord [sauroncharacter|e] has commanded me to return to [GetTitleByKey('e_mumakan').GetNameNoTier] and deal with any threats that arise to our plans in the south. being one of the [nazgul|e] i have no choice but to accept"
 qfe_misc.12.a: "My Lord Commands"
 
 qfe_misc.13.t: "Indurs Return"
 qfe_misc.13.desc: "[GetScriptedCharacterByHistoryID('nazgul4').GetFirstName] has returned to [GetTitleByKey('e_mumakan').GetNameNoTier] and declared himself once again. his heralds have reached us demanding that we swear allegiance in service of the great eye. do we accept"
 qfe_misc.13.a: "Hail the lord of the south"
 qfe_misc.13.b: "We stand alone"
 
 qfe_misc.14.t: "Return to Khand"
 qfe_misc.14.desc: "My lord [sauroncharacter|e] has commanded me to return to [GetTitleByKey('e_khand').GetNameNoTier] and deal with any threats that arise to our plans in the east. being one of the [nazgul|e] i have no choice but to accept"
 qfe_misc.14.a: "My lord commands"
 
 qfe_misc.15.t: "Return of Ovantha"
 qfe_misc.15.desc: "[GetScriptedCharacterByHistoryID('nazgul9').GetFirstName] has returned to [GetTitleByKey('e_khand').GetNameNoTier] and declared himself once again. his heralds have reached us demanding that we swear allegiance in service of the great eye. do we accept"
 qfe_misc.15.a: "Hail the Lord of Khand"
 qfe_misc.15.b: "We Stand Alone"
 
 ### Rhovanion Story
 
 qfe_rhovanion.001.t: "The Last Sons of Rhovanion"
 qfe_rhovanion.001.desc: "[GetScriptedCharacterByHistoryID('lineofliuva1').GetFirstName] is the last heir to the ancient Kingdom of [GetTitleByKey('k_rhovanion').GetNameNoTier], a long time ally of the kings of [gondor|e] before they were destoryed by the Wainriders.\n\nNow [GetScriptedCharacterByHistoryID('lineofliuva1').GetFirstName] has ralleyed the scattered remnents of his people and exerted control over the wastes that once formed the heartland of the kingdom. but he dreams of more, of a true restoration! and thus he turns his attention to the Steward"
 qfe_rhovanion.001.a: "Maybe the Steward is intrested in an Alliance"
 travel_minas_tirith: "I will [travel|e] to [GetTitleByKey('c_minas_tirith').GetNameNoTier]"
 
 qfe_rhovanion.002.t: "Renew the Broken Bonds"
 qfe_rhovanion.002.desc: "[gondor|e] has waned from its height in the early [thirdage|e] but it still represents the greatest realm of men in the North of Middle-earth. I wish to renew the bonds that once bound Gondor and Rhovanion and seek the stewards help in a war to reclaim our lost realm. now to see if the steward is intrested"
 qfe_rhovanion.002.a: "Promise Aid in exchange for support"
 qfe_rhovanion.002.a.sucess: "You and Gondor immediately Launch a war against the Easterlings"
 qfe_rhovanion.002.a.failure: "The Steward isn't Intrested"
 
 qfe_rhovanion.003.t: "The War of Renewal"
 qfe_rhovanion.003.desc: "The Steward has agreed to my request and is immediately mobilizing his armies for a war to Smash the [GetTitleByKey('e_golden_realm_rhun').GetNameNoTier] and all other forces of darkness on the plains! He has bestowed his support on me as the Heir to [GetTitleByKey('k_rhovanion').GetNameNoTier] and promised a renewed period of peace and friendship between our peoples!"
 qfe_rhovanion.003.a: "Together to Victory!"
 
 qfe_rhovanion.004.t: "The War of Renewal"
 qfe_rhovanion.004.desc: "[GetScriptedCharacterByHistoryID('lineofliuva1').GetFirstName] has forged an alliance with the [steward|e] of [gondor|e] in order to reclaim our long lost realm from the Easterlings! he has sent out heralds to all the remaining men of Rhovanion to pledge their support. how do we respond?"
 qfe_rhovanion.004.a: "Together to Victory!"
 qfe_rhovanion.004.b: "This is not our fight"
 
 qfe_rhovanion.005.t: "Revenge of Rhovanion"
 qfe_rhovanion.005.desc: "[GetScriptedCharacterByHistoryID('lineofliuva1').GetName] and the Steward of [GetTitleByKey('e_gondor_steward').GetNameNoTier] have attacked us! They claim to be trying to liberate the plains from our 'tyranny' and restore the ancient kingdom of [GetTitleByKey('k_rhovanion').GetNameNoTier]. nevertheless, it seems we have a fight on our hands..."
 qfe_rhovanion.005.a: "Let them Come"
 
 qfe_rhovanion.006.t: "Revenge of Rhovanion"
 qfe_rhovanion.006.desc: "[GetScriptedCharacterByHistoryID('lineofliuva1').GetName] and the Steward of [GetTitleByKey('e_gondor_steward').GetNameNoTier] have attacked The [GetTitleByKey('e_golden_realm_rhun').GetName]! They claim to be trying to liberate the plains from their 'tyranny' and restore the ancient kingdom of [GetTitleByKey('k_rhovanion').GetNameNoTier]. If we do nothing they will surely destory our allies and once more place an enemy realm on our border."
 qfe_rhovanion.006.a: "We wont abandon them"
 qfe_rhovanion.006.b: "Its not our problem"
 
 qfe_rhovanion.007.a: "To a New Age!"
 
 qfe_rhovanion.008.t: "Herald from the Plains"
 qfe_rhovanion.008.desc: "[GetScriptedCharacterByHistoryID('lineofliuva1').GetName], the last heir to the ancient realm of [GetTitleByKey('k_rhovanion').GetName], has arrived in [GetTitleByKey('c_minas_tirith').GetName] with an intresting proposition. He senses weakness in the [GetTitleByKey('e_golden_realm_rhun').GetName], and with my help he seeks to topple the Easterlings and restore the realm of [GetTitleByKey('k_rhovanion').GetName].\n\nWhat he leaves out however is that while he has the support of his people, he alone cant fight this war. he is really asking for a gondorian expidition to place him upon the throne. of course thats still advantagous given the growing power of [mordor|e], but the decision is up to us"
 qfe_rhovanion.008.a: "We Ride to War!"
 qfe_rhovanion.008.b: "Now is not the Time"
 
 