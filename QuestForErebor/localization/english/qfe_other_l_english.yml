 ### Biuldings
 
 building_type_wonder_thorins_hall_01: "Thorin's Hall"
 building_type_wonder_thorins_hall_01_desc: "Dronûn-Dûm, or Thorin's Hall, the [dwarven|E] hold in the Southern [bluemountains|E] built by Thorin Oakenshield."
 building_wonder_thorins_hall_01: "The Hall of Thorin Oakenshield"
 building_wonder_thorins_hall_01_desc: "Following Smaug's conquest of [erebor|E] and the devastating [warofdwarvesandorcs|E], Thorin Oakenshield, rightful King Under the Mountain, established a [dwarven|E] hold in the Southern [bluemountains|E] where he and the exiled [longbeards|E] dwelt for nearly a century. Following the Reclamation of Erebor and the [battle_of_the_five_armies|E], many of the Longbeards returned to their ancestral home, leaving Thorin's halls a relic of more desperate days."
 building_wonder_thorins_hall_02: "Dronûn-Dûm"
 building_wonder_thorins_hall_02_desc: "The Halls of Thorin Oakenshield have been delved deeper and expanded with a great gate in the style of [ereborrealm|e], transforming the once hard scrabble realm into a true [dwarven|E] city"
 building_wonder_thorins_hall_03: "Dronûn-Dûm Resplendent"
 building_wonder_thorins_hall_03_desc: "The Once small realm of Thorin Oakenshield has been transformed into a thriving [dwarven|E] hold rivaling the great holds of old. the original quickly built structures have been replaced with more sturdy and magnificent designs, and mines dig deep into the ancient mountains, harvesting the rich minerals left over from the [warofwrath|e]"

 building_type_wonder_erebor_broken: "Erebor"
 building_wonder_erebor_broken: "Erebor Broken"
 building_wonder_erebor_broken_desc: "Erebor has been smashed by the dragon [smaug|E], visters can barely go ten paces without encountering the bones of the kingdoms defenders or reaching a collapsed tunnel or bridge that the dragon destoryed and the great gate lies in ruin, preventing the realm from being adaquatly defended"
 building_wonder_erebor_t2: "Erebor Repaired"
 building_wonder_erebor_t2_desc: "The bodies have been cleaned up, a new gate has been made, and the vast horde of the [dragon|E] has been properly stowed away, the [lonelymountain|E] is once more liveable, if not quite at the level it was before the [sackoferebor|e]"
 building_wonder_erebor_rebuilt: "Erebor Restored"
 building_wonder_erebor_rebuilt_desc: "Erebor has been restored to its former glory, gold once again flows from the [lonelymountain|E] and the clang of hammers once more rings out from the depths. Erebor once more takes its rightful place as the capital of the [longbeards|e] and by extension all of dwarf kind"
 building_wonder_erebor_t4: "Erebor Resplendent"
 building_wonder_erebor_t4_desc: "Erebor is reaching heights not seen since the days of [nogrod|e], [belegost|e] and [khazaddum|e] the halls are light bright as day with carefully designed mirrors and sun roofs, Statues made of solid Gold flank the throughfares and visitors from across the north flock to the center of dwarvenkind"
 building_wonder_erebor_reborn: "Erebor Workshop of the Maker" 
 building_wonder_erebor_reborn_desc: "Erebor has surpassed all the dwarven holds of the [elderdays|e], its great gate visible for miles. at night the mountian top is lit with a great lamp, reminicient of the works of [aulecharacter|e], as bright as a star as far away as [minastirith|e] and unrivaled in Middle Earth. Erebor has become grander than even the great [khazaddum|e] and only the halls of the [valargods|e] surpass it" 
 qfe_sauron_hidden_as_necromancer_duchy: "$sauron_hidden_as_necromancer$"
