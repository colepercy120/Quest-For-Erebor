 ### Situation
 situation_desolation_of_smaug: "The Desolation of Smaug"
 situation_desolation_of_smaug_description: "#emphasis The pines were roaring on the height,\nThe winds were moaning in the night.\nThe fire was red, it flaming spread;\nThe trees like torches blazed with light.#!"
 situation_desolation_of_smaug_description2: "in [ageTA|e] 2770 the dragon [smaug|e] attacked the [ereborrealm|e] in the [sackoferebor|e]. destroying the kingdom and most of the surrounding area. Now, the land around [erebor|e] is known as the Desolation of Smaug, a blasted and barren land that is warped by the [dragons|e] very presence. Those who remain in the area have to constantly beware the serpent, ever hoping for the return of the King Under the Mountain."
 
